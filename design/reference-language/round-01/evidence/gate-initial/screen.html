<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>여행 일정 편집 — 언어 재구성</title><link rel="stylesheet" href="ui.css"></head>
<body class=""><main class="screen"><div class="screen-content"><header class="title-row screen-inset">
  <button class="back" type="button" disabled aria-label="뒤로가기 — 정적 표본에서 비활성"><img src="assets/chevron-left.svg" alt=""></button>
  <h1>여행 일정 편집</h1><span aria-hidden="true"></span>
</header><div class="day-selector screen-inset" role="group" aria-label="날짜 선택 상태를 보여 주는 정적 표본">
  <span class="day-pill is-selected" aria-label="Day 1, 선택됨">Day 1</span>
  <span class="day-pill" aria-label="Day 2, 선택되지 않음">Day 2</span>
  <span class="day-pill" aria-label="Day 3, 선택되지 않음">Day 3</span>
</div><div class="day-groups screen-inset">
<section class="day-group"><h2 class="day-heading">Day 1<span>(06.25)</span></h2><div class="place-list"><div class="place-row">
  <input class="place-check" type="checkbox" aria-label="Jingūmae, Shibuya 선택">
  <div class="place-card"><img class="place-photo" src="assets/photo-1.png" alt="">
    <div class="place-copy"><p class="place-area">Jingūmae, Shibuya</p><p class="place-type">Activity</p></div>
    <img class="place-grip" src="assets/grip-vertical.svg" alt="" aria-hidden="true">
  </div>
</div></div></section>
<section class="day-group"><h2 class="day-heading">Day 2<span>(06.26)</span></h2><div class="place-list"><div class="place-row">
  <input class="place-check" type="checkbox" aria-label="와라타코 하라주쿠 오모테산도점 Jingūmae, Shibuya 선택">
  <div class="place-card"><img class="place-photo" src="assets/photo-2.png" alt="">
    <div class="place-copy"><p class="place-name">와라타코 하라주쿠 오모테산도점</p><p class="place-area">Jingūmae, Shibuya</p><p class="place-type">Restaurant</p></div>
    <img class="place-grip" src="assets/grip-vertical.svg" alt="" aria-hidden="true">
  </div>
</div><div class="place-row">
  <input class="place-check" type="checkbox" aria-label="Dōgenzaka, Shibuya 선택">
  <div class="place-card"><img class="place-photo" src="assets/photo-3.png" alt="">
    <div class="place-copy"><p class="place-area">Dōgenzaka, Shibuya</p><p class="place-type">Restaurant</p></div>
    <img class="place-grip" src="assets/grip-vertical.svg" alt="" aria-hidden="true">
  </div>
</div></div></section>
<section class="day-group"><h2 class="day-heading">Day 3<span>(06.27)</span></h2><div class="observed-fragment" aria-label="Day 3에서 관찰된 사진 상단 조각, 장소 정보 미상"><img src="assets/photo-fragment.png" alt=""></div></section>
</div></div><footer class="completion-footer screen-inset"><button class="complete-button" type="button" disabled>수정 완료</button></footer></main></body></html>
