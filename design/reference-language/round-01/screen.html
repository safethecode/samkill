<!DOCTYPE html>

<html lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>여행 일정 편집 — 언어 재구성</title><link href="ui.css" rel="stylesheet"/></head>
<body class=""><main class="screen"><div class="screen-content"><header class="title-row screen-inset">
<button aria-label="뒤로가기 — 정적 표본에서 비활성" class="back" disabled="" type="button"><img alt="" src="assets/chevron-left.svg"/></button>
<h1>여행 일정 편집</h1><span aria-hidden="true"></span>
</header><div aria-label="날짜 선택 상태를 보여 주는 정적 표본" class="day-selector screen-inset" role="group">
<span aria-label="Day 1, 선택됨" class="day-pill is-selected">Day 1</span>
<span aria-label="Day 2, 선택되지 않음" class="day-pill">Day 2</span>
<span aria-label="Day 3, 선택되지 않음" class="day-pill">Day 3</span>
</div><div class="day-groups screen-inset">
<section class="day-group"><h2 class="day-heading">Day 1<span>(06.25)</span></h2><ul class="place-list"><li class="place-row">
<input aria-label="Jingūmae, Shibuya 선택" class="place-check" type="checkbox"/>
<div class="place-card"><img alt="" class="place-photo" src="assets/photo-1.png"/>
<div class="place-copy"><p class="place-area">Jingūmae, Shibuya</p><p class="place-type">Activity</p></div>
<img alt="" aria-hidden="true" class="place-grip" src="assets/grip-vertical.svg"/>
</div>
</li></ul></section>
<section class="day-group"><h2 class="day-heading">Day 2<span>(06.26)</span></h2><ul class="place-list"><li class="place-row">
<input aria-label="와라타코 하라주쿠 오모테산도점 Jingūmae, Shibuya 선택" class="place-check" type="checkbox"/>
<div class="place-card"><img alt="" class="place-photo" src="assets/photo-2.png"/>
<div class="place-copy"><p class="place-name">와라타코 하라주쿠 오모테산도점</p><p class="place-area">Jingūmae, Shibuya</p><p class="place-type">Restaurant</p></div>
<img alt="" aria-hidden="true" class="place-grip" src="assets/grip-vertical.svg"/>
</div>
</li><li class="place-row">
<input aria-label="Dōgenzaka, Shibuya 선택" class="place-check" type="checkbox"/>
<div class="place-card"><img alt="" class="place-photo" src="assets/photo-3.png"/>
<div class="place-copy"><p class="place-area">Dōgenzaka, Shibuya</p><p class="place-type">Restaurant</p></div>
<img alt="" aria-hidden="true" class="place-grip" src="assets/grip-vertical.svg"/>
</div>
</li></ul></section>
<section class="day-group"><h2 class="day-heading">Day 3<span>(06.27)</span></h2><div aria-label="Day 3에서 관찰된 사진 상단 조각, 장소 정보 미상" class="observed-fragment"><div class="place-card fragment-card"><img alt="" src="assets/photo-fragment.png"/></div></div></section>
</div></div><footer class="completion-footer screen-inset"><button class="complete-button" disabled="" type="button">수정 완료</button></footer></main></body></html>
